databases:
  - name: mysitedb
    plan: free

services:
  - type: web
    name: mysite
    runtime: python
    plan: free

    buildCommand: cd StudentResultManagement && ./build.sh
    startCommand: gunicorn --chdir StudentResultManagement StudentResultManagement.asgi:application -k uvicorn.workers.UvicornWorker

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mysitedb
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: false

      - key: DJANGO_SUPERUSER_USERNAME
        value: admin

      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@example.com

      - key: DJANGO_SUPERUSER_PASSWORD
        value: Admin@123456

      - key: PYTHON_VERSION
        value: 3.10.12
