{% extends 'base.html' %}

{% block content %}
<div class="container py-5" id="result_sheet">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow">
                <div class="card-header text-center bg-dark text-white">
                    <h4><i class="fas fa-graduation-cap me-2"></i>Notice</h4>
                </div>
                <div class="card-body">

                    {% if error %}
                    <div class="alert alert-danger text-center">{{error}}</div>
                    {%endif%}
                    <div class="text-center">
                        <h3 class="mb-3"><i class="fas fa-bullhorn me-2"></i>{{notice.title}}</h3>
                    </div>
                    <p><strong>Notice Posting Date: </strong>{{notice.posting_date}}</p>
                    <p><strong>Notice Description: </strong>{{notice.description}}</p>

                </div>
            </div>
        </div>
    </div>
</div>


{% endblock %}
