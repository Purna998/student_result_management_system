{%extends 'admin_base.html'%}

{%block content%}

<div class="container-fluid">
    <h2 class="mb-4"><i class="fas fa-plus-circle me-1"></i>Add Subject Combination</h2>
    {% if messages%}
    {% for m in messages%}
    <div class="alert alert-{%if m.tags == 'error' %}danger{%else%}success{%endif%} alert-dismissible fade show"
        roles="alert">
        {{m}}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    {%endfor%}
    {% endif %}
    <form method="post">
        {%csrf_token%}
        <div class="mb-3">
            <label for="class" class="form-label">Select Class</label>
            <select class="form-select" id="class" name="class" required>
                <option value="">--Select Class--</option>
                {%for class in classes%}
                <option value="{{class.id}}">{{class.class_name}} - Section {{class.section}}</option>
                {%endfor%}

            </select>

        </div>

        <div class="mb-3">
            <label for="subject" class="form-label">Select Subject</label>
            <select class="form-select" id="subject" name="subject" required>
                <option value="">--Select Subject--</option>
                {%for subject in subjects%}
                <option value="{{subject.id}}">{{subject.subject_name}} - {{subject.subject_code}}</option>%}
                {%endfor%}
            </select>

        </div>

        <button class="btn btn-dark">
            <i class="fas fa-check-circle me-1"></i> Submit
        </button>
    </form>
</div>
{%endblock%}
