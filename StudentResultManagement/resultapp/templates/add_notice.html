{%extends 'admin_base.html'%}

{%block content%}

<div class="container-fluid">
    <h2 class="mb-4"><i class="fas fa-user-plus me-1"></i>Add Notice</h2>
    {% if messages%}
    {% for m in messages%}
    <div class="alert alert-{%if m.tags == 'error' %}danger{%else%}success{%endif%} alert-dismissible fade show"
        roles="alert">
        {{m}}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    {%endfor%}
    {% endif %}
    <form method="post">
        {%csrf_token%}
        <div class="mb-3">
            <label for="title" class="form-label">Notice Title</label>
            <input type="text" class="form-control" id="title" name="title" required placeholder="Enter Notice Title">

        </div>

        <div class="mb-3">
            <label for="description" class="form-label">Notice Description</label>
            <textarea class="form-control" rows="5" id="description" name="description" required
                placeholder="Enter Notice Description"></textarea>
        </div>





        <button class="btn btn-dark">
            <i class="fas fa-check-circle me-1"></i> Submit
        </button>
    </form>
</div>
{%endblock%}
