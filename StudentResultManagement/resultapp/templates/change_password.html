{%extends 'admin_base.html'%}

{%block content%}

<div class="container-fluid">
    <h2 class="mb-4"><i class="fas fa-key me-1"></i>Change Password</h2>
    {% if messages%}
    {% for m in messages%}
    <div class="alert alert-{%if m.tags == 'error' %}danger{%else%}success{%endif%} alert-dismissible fade show"
        roles="alert">
        {{m}}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    {%endfor%}
    {% endif %}
    <form method="post">
        {%csrf_token%}
        <div class="mb-3">
            <label for="old_password" class="form-label">Old Password</label>
            <input type="password" class="form-control" id="old_password" name="old_password" required
                placeholder="Enter Old Password">
        </div>

        <div class="mb-3">
            <label for="new_password" class="form-label">New Password</label>
            <input type="password" class="form-control" id="new_password" name="new_password" required
                placeholder="Enter New Password">
        </div>

        <div class="mb-3">
            <label for="confirm_pass" class="form-label">Confirm New Password</label>
            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required
                placeholder="Enter Confirm New Password">
        </div>

        <button class="btn btn-dark">
            <i class="fas fa-check-circle me-1"></i> Submit
        </button>
    </form>
</div>
{%endblock%}
