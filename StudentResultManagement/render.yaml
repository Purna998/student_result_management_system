databases:
  - name: mysitedb
    plan: free

services:
  - type: web
    name: mysite
    runtime: python
    plan: free

    buildCommand: ./build.sh
    startCommand: gunicorn StudentResultManagement.asgi:application -k uvicorn.workers.UvicornWorker

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mysitedb
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: false
